# Shipyard 全局配置示例。复制整个目录到 data/（得到 data/config.yaml 和 data/projects/*.yaml），
# 或用 CONFIG_PATH 指定 config.yaml 的路径，projects/ 放在它旁边。
# 服务运行时会热加载：每次发起发布前重新读取并校验，改环境、改白名单、增删项目都不用重启。
#   - 本文件改坏了：暂停所有新发布
#   - 某个 projects/*.yaml 改坏了：只暂停这个项目，其余项目照常

server:
  port: 8080
  # 飞书卡片里「查看详情」的链接前缀；不填则卡片不带链接
  # publicUrl: https://deploy.example.internal
  maxConcurrent: 3          # 所有项目加起来同时执行的环境数上限（install + build 很吃 CPU / 内存）
  logRetentionDays: 30      # 发布记录和日志保留天数

access:
  allowIps:                 # 允许执行（发起 / 取消 / 重试）的 IP，支持 CIDR
    - 127.0.0.1
    - ::1
    # - 203.0.113.10        # 示例：办公室出口 IP
    # - 10.8.0.0/16         # 示例：VPN 网段
  protectReads: false       # true：查看类接口也要求在白名单内
  # 服务前面有反向代理时设为 true（compose 部署时前面是 Caddy，见 deploy/caddy/Caddyfile）。
  # 经代理转发的请求不会被当成代理自己的地址（通常是白名单里的 127.0.0.1）：没开 trustProxy、
  # 或代理没带 X-Forwarded-For，来源 IP 都按「未知」处理，不能执行，服务日志会提示原因。
  trustProxy: false
  proxyIps: [127.0.0.1, ::1] # 反向代理所在的地址，只信任它们转发来的 X-Forwarded-For
  # 允许的来源（Origin / Host）。留空 = 只允许同源访问，任何 Host 都行（适合开发或直接用 IP 访问）
  # 上线时务必填写对外地址，防止 DNS 重绑定
  allowedOrigins: []
  #  - https://deploy.example.internal

# 所有项目共用的登录身份
ssh:
  user: root
  port: 22
  privateKeyPath: ssh/deploy.pem   # 相对路径以本配置文件所在目录为准；权限请设为 0600
  keepPrevious: true        # 替换时把旧版本保留为 <目录>.prev，方便手工回滚

# 私有仓库的令牌，按主机配置，所有项目共用。git clone 时经临时凭据助手传给 git，
# 不写进仓库地址、不出现在进程参数和日志里。projects/*.yaml 里的仓库地址不带凭据。
#   Codeup：头像 → 个人设置 → 个人访问令牌，只勾 read_repository，设到期时间；username 填 oauth2
#           （和旧格式地址 https://oauth2:<令牌>@codeup.aliyun.com/… 里的是同一对，直接搬过来即可）
#   GitHub：Fine-grained token，只给需要的仓库 Contents: Read-only；username 填 x-access-token
# 令牌只写在 data/config.yaml，不要写回本文件。公开仓库不用配置。
git:
  credentials:
    - { host: codeup.aliyun.com, username: oauth2, token: <令牌> }
    - { host: github.com, username: x-access-token, token: <令牌> }

# 可选的 node 版本。键是自己起的名字，值是那个版本 node 所在的 bin 目录（容器里的路径）。
# 默认用镜像自带的 node（Dockerfile 的 NODE_VERSION）；项目或环境的 build.node 写某个键时，
# 安装和构建阶段会把这个目录放到 PATH 最前面，node、npx 和带 node shebang 的 CLI 都用它。
# 目录可以放在 data/runtimes/ 下（容器里是 /data/runtimes），解压官方的 node-vXX-linux-x64.tar.xz 即可。
runtimes:
  node: {}
  #  node20: /data/runtimes/node-v20.20.2-linux-x64/bin

# 所有项目的默认构建方式，项目文件和单个环境都可以按字段覆盖
build:
  install: "bun install"
  build: "bun run build"
  dist: "dist"
  # node: node20            # 不写 = 镜像默认 node

notify:
  feishu:
    # 飞书自定义机器人 webhook；留空则不推送。也可以用环境变量 FEISHU_WEBHOOK 覆盖
    webhook: ""
    # 仅当机器人开启「签名校验」时填写（或用环境变量 FEISHU_SECRET）
    # secret: ""
