# 项目文件：data/projects/<项目 key>.yaml。文件名就是项目 key，会写进发布记录，定了就不要改。
# 充值网站：按国家分组，发布目录按模板拼出来。
name: 充值网站
order: 10                   # 顶栏里的顺序，小的在前
grouping: country           # country：先选国家再选环境；none：直接选环境

remotePathTemplate: "/home/topup-web/{server}/dist"   # 环境没写 remotePath 时，用 server 代入

# build:                    # 只写和 config.yaml 里默认值不同的字段
#   node: node20

