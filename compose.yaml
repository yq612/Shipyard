# 生产部署的唯一方式。在仓库根目录执行：
#   首次：准备好 data/config.yaml 和 data/ssh/deploy.pem，然后 docker compose up -d --build
#   升级：git pull && docker compose up -d --build
# 运行时数据全在 ./data（config.yaml、ssh/deploy.pem、shipyard.db、logs/），
# 不进 git 也不进镜像，重建容器不会动它。
services:
  shipyard:
    build: .
    image: shipyard:latest
    restart: unless-stopped
    # 与宿主机共用网络，服务看到的客户端 IP 和不用 Docker 时一致，IP 白名单才有效。
    # 不要改成 ports: 端口映射：bridge 网络下宿主机和 nginx 发来的请求都会变成网关地址（如 172.18.0.1）。
    # Docker Desktop（Mac）需要在设置里开启 host 网络；本地开发直接用 bun run dev。
    network_mode: host
    environment:
      TZ: Asia/Shanghai
      # PORT: "8080"                     # 换端口改这里（健康检查也读它），不要只改 config.yaml 的 server.port
      # HOST: 127.0.0.1                  # 前面有 nginx 时只监听本机，不直接对外
      # FEISHU_WEBHOOK: https://open.feishu.cn/open-apis/bot/v2/hook/xxxx
      # SHUTDOWN_TIMEOUT_MS: "600000"
    volumes:
      - ./data:/data
      - bun-cache:/root/.bun/install/cache
    stop_grace_period: 11m               # 比 SHUTDOWN_TIMEOUT_MS 稍长，让执行中的环境跑完
volumes:
  bun-cache:
