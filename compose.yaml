# 生产部署的唯一方式。在仓库根目录执行：
#   首次：准备好 .env、data/config.yaml 和 data/ssh/deploy.pem，然后 docker compose up -d --build
#   升级：deploy/upgrade.sh（git pull + 重建 + 按需重载 Caddy + 清理旧镜像）
# 运行时数据全在 ./data（config.yaml、ssh/deploy.pem、shipyard.db、logs/），证书在 caddy-data 卷里，
# 都不进 git 也不进镜像，重建容器不会动它们。
# 这台服务器特有的值只写在 .env 和 data/ 里，不要改本文件，否则 git pull 会冲突。
x-logging: &logging
  driver: json-file
  options: { max-size: 20m, max-file: "5" }

services:
  shipyard:
    build: .
    image: shipyard:latest
    restart: unless-stopped
    # 与宿主机共用网络，服务看到的客户端 IP 和不用 Docker 时一致，IP 白名单才有效。
    # 不要改成 ports: 端口映射：bridge 网络下宿主机和 Caddy 发来的请求都会变成网关地址（如 172.18.0.1）。
    # Docker Desktop（Mac）需要在设置里开启 host 网络；本地开发直接用 bun run dev。
    network_mode: host
    environment:
      TZ: Asia/Shanghai
      HOST: 127.0.0.1                    # 只监听本机，对外一律经 Caddy（Caddyfile 反代到 8080，不要改 PORT）
      FEISHU_WEBHOOK: ${FEISHU_WEBHOOK:-} # 可选，写在 .env；留空则用 config.yaml 里的
      FEISHU_SECRET: ${FEISHU_SECRET:-}
    volumes:
      - ./data:/data
      - bun-cache:/root/.bun/install/cache
    stop_grace_period: 11m               # 比 SHUTDOWN_TIMEOUT_MS 稍长，让执行中的环境跑完
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: host                   # 占用宿主机 80 / 443，反代到 127.0.0.1:8080
    environment:
      SHIPYARD_DOMAIN: ${SHIPYARD_DOMAIN:?在仓库根目录的 .env 里设置 SHIPYARD_DOMAIN}
    volumes:
      # 挂目录而不是单个文件：git pull 会整个替换 Caddyfile，单文件挂载的容器会一直看到旧内容
      - ./deploy/caddy:/etc/caddy:ro
      - caddy-data:/data                 # 证书和 ACME 账号。别删：重复申请会撞上 Let's Encrypt 的频率限制
      - caddy-config:/config
    logging: *logging

volumes:
  bun-cache:
  caddy-data:
  caddy-config:
